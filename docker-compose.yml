services:
  db:
    image: postgres:16-alpine
    container_name: transaction-queue-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_queue
    ports:
      # 5433 on the host avoids clashing with a Postgres already using 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_queue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: